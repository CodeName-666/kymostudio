name: Build Installer

# Builds KymoStudio with PyInstaller, packs it into an Inno Setup installer and
# publishes it as a GitHub Release.
# - Runs on push to master (via pull request from develop) or manually;
#   documentation-only pushes are ignored.
# - The version comes from python/Core/version.py; the tag is v<version>.
# - Build and release only run after the test suite is green.
# - The bundled exe must pass --smoke-test before anything is published.

on:
  push:
    branches: [master]
    # Documentation-only changes must not try to publish a release
    # (the version is unchanged, so the publish guard would fail).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node tests/js/chart_math.test.cjs
      - run: node tools/check_qml_scripts.cjs
      - run: python tools/check_backend_contracts.py

  build:
    name: Build (Windows)
    runs-on: windows-latest
    needs: tests
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-build.txt'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'python'); from Core.version import __version__; print(__version__)")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo ">> Build version: ${VERSION}"

      - name: Build installer (PyInstaller + Inno Setup)
        shell: bash
        env:
          CLEAN: "1"
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/build/build-installer.sh

      - name: Smoke-test the bundled exe
        shell: bash
        env:
          QT_QUICK_BACKEND: software
        run: ./build/dist/KymoStudio/KymoStudio.exe --smoke-test

      - name: Create SHA256 sidecar
        shell: bash
        run: |
          INSTALLER=$(ls build/installer/KymoStudio_*_Setup.exe | head -n 1)
          NAME=$(basename "${INSTALLER}")
          HASH=$(sha256sum "${INSTALLER}" | awk '{print $1}')
          echo "${HASH}  ${NAME}" > "${INSTALLER}.sha256"
          {
            echo "## Release integrity"
            echo ""
            echo "**File:** \`${NAME}\`  "
            echo "**SHA256:** \`${HASH}\`"
            echo ""
            echo "Verify on Windows: \`certutil -hashfile ${NAME} SHA256\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installer artefact
        uses: actions/upload-artifact@v4
        with:
          name: KymoStudio-Setup-${{ steps.version.outputs.version }}
          path: |
            build/installer/KymoStudio_*_Setup.exe
            build/installer/KymoStudio_*_Setup.exe.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Upload onedir build (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KymoStudio-onedir-${{ steps.version.outputs.version }}
          path: build/dist/KymoStudio/
          retention-days: 3

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Only release from master
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Installer releases may only be published from master."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: KymoStudio-Setup-${{ needs.build.outputs.version }}
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
            if [ "${tag_type}" = "tag" ]; then
              tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')
            fi
            if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::Release ${tag} belongs to ${tag_sha}. Bump python/Core/version.py before a new release."
              exit 1
            fi
            gh release upload "${tag}" release/* --clobber
          else
            gh release create "${tag}" release/* \
              --target "${GITHUB_SHA}" \
              --title "KymoStudio ${tag}" \
              --generate-notes
          fi
          echo "- GitHub Release: \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
